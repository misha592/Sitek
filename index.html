<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>>-<</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            max-height: 100vh;
            overflow: hidden; /* Полностью запрещает любой скролл на странице */
            position: relative;
        }

        /* Задний фон */
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -2;
            transition: transform 0.5s ease;
        }

        /* Оверлей */
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            transition: background 0.5s ease;
        }

        /* Основная карточка */
        .bio-card {
            position: relative;
            padding: 35px 25px;
            border-radius: 16px;
            text-align: center;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            width: 320px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid transparent;
        }
        
        body:hover .background-image {
            transform: scale(1.02);
        }

        .avatar-container {
            position: relative;
            width: 105px;
            height: 105px;
            margin: 0 auto 25px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            transition: border-color 0.5s ease;
        }

        /* Индикатор статуса */
        .status-dot {
            position: absolute;
            bottom: 3px;
            right: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 4px solid transparent;
            transition: background-color 0.3s ease, border-color 0.5s ease;
        }

        .status-online { background-color: #23a55a; }
        .status-idle { background-color: #f0b232; }
        .status-dnd { background-color: #f23f43; }
        .status-offline { background-color: #747f8d; }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 4px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        /* Текст статуса */
        .status-caption {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        .tag {
            font-weight: 400;
            font-size: 0.8rem;
            margin-bottom: 20px;
            display: block;
            letter-spacing: 0.5px;
            transition: color 0.5s ease;
        }

        .status-box {
            font-size: 0.85rem;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px solid transparent;
            transition: background 0.5s ease, border-color 0.5s ease, color 0.5s ease;
        }

        .activity-text {
            font-size: 0.75rem;
            transition: color 0.5s ease;
        }

        /* Кнопка ссылки на Дискорд */
        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .discord-btn:hover {
            transform: scale(1.02);
        }

        /* Разделитель */
        .separator {
            height: 1px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        /* Блок формы вебхука */
        .msg-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .msg-input {
            width: 100%;
            box-sizing: border-box; /* Чтобы отступы не распирали карточку */
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 0.8rem;
            outline: none;
            resize: none;
            font-family: inherit;
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        .msg-input:focus {
            background: rgba(0, 0, 0, 0.6);
        }

        .msg-send-btn {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .msg-send-btn:hover {
            transform: scale(1.01);
        }

        .msg-status {
            font-size: 0.75rem;
            margin-top: 4px;
            display: none;
        }

        /* --- СТИЛИ ДЛЯ ТЕМЫ 1 (ЗАКАТ) --- */
        .theme-sunset .background-overlay { background: linear-gradient(180deg, rgba(15, 10, 5, 0.5) 0%, rgba(5, 3, 0, 0.85) 100%); }
        .theme-sunset .bio-card { background: rgba(18, 14, 10, 0.65); border: 1px solid rgba(220, 150, 80, 0.15); box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9), 0 0 40px rgba(220, 150, 80, 0.03); }
        .theme-sunset .bio-card:hover { border-color: rgba(220, 150, 80, 0.3); background: rgba(22, 16, 12, 0.75); }
        .theme-sunset .avatar { border-color: rgba(220, 150, 80, 0.25); }
        .theme-sunset .status-dot { border-color: #18120e; }
        .theme-sunset .status-caption { color: #dd9c5a; text-shadow: 0 0 10px rgba(221, 156, 90, 0.2); }
        .theme-sunset .tag { color: rgba(220, 180, 150, 0.35); }
        .theme-sunset .status-box { background: rgba(10, 7, 5, 0.5); border-color: rgba(220, 150, 80, 0.06); color: #f3e8de; }
        .theme-sunset .activity-text { color: #a89485; }
        .theme-sunset .discord-btn { background: rgba(220, 150, 80, 0.1); border-color: rgba(220, 150, 80, 0.25); color: #dd9c5a; box-shadow: 0 0 15px rgba(220, 150, 80, 0.1); }
        .theme-sunset .discord-btn:hover { background: rgba(220, 150, 80, 0.2); box-shadow: 0 0 20px rgba(220, 150, 80, 0.4); }
        .theme-sunset .msg-input:focus { border-color: rgba(220, 150, 80, 0.4); }
        .theme-sunset .msg-send-btn { background: #dd9c5a; color: #120e0a; }

        /* --- СТИЛИ ДЛЯ ТЕМЫ 2 (ГУЛЬ / БРАЙАР) --- */
        .theme-ghoul .background-overlay { background: linear-gradient(180deg, rgba(20, 0, 0, 0.55) 0%, rgba(5, 0, 0, 0.9) 100%); }
        .theme-ghoul .bio-card { background: rgba(12, 5, 5, 0.7); border: 1px solid rgba(239, 68, 68, 0.15); box-shadow: 0 40px 100px rgba(0, 0, 0, 0.95), 0 0 40px rgba(239, 68, 68, 0.03); }
        .theme-ghoul .bio-card:hover { border-color: rgba(239, 68, 68, 0.35); background: rgba(16, 6, 6, 0.8); }
        .theme-ghoul .avatar { border-color: rgba(239, 68, 68, 0.25); }
        .theme-ghoul .status-dot { border-color: #0c0505; }
        .theme-ghoul .status-caption { color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
        .theme-ghoul .tag { color: rgba(239, 150, 150, 0.3); }
        .theme-ghoul .status-box { background: rgba(10, 4, 4, 0.6); border-color: rgba(239, 68, 68, 0.08); color: #fca5a5; }
        .theme-ghoul .activity-text { color: #f87171; }
        .theme-ghoul .discord-btn { background: rgba(239, 68, 68, 0.08); border-color: rgba(239, 68, 68, 0.25); color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.1); }
        .theme-ghoul .discord-btn:hover { background: rgba(239, 68, 68, 0.2); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        .theme-ghoul .msg-input:focus { border-color: rgba(239, 68, 68, 0.4); }
        .theme-ghoul .msg-send-btn { background: #ef4444; color: #ffffff; }
    </style>
</head>
<body>

    <div id="bg" class="background-image"></div>
    <div id="overlay" class="background-overlay"></div>

    <div id="card" class="bio-card">
        <div class="avatar-container">
            <img id="discord-avatar" class="avatar" src="https://archive.org/download/discord-loading-dots-discord-loading/discord-loading-dots-discord-loading.gif" alt="Avatar">
            <div id="status-dot" class="status-dot"></div>
        </div>
        
        <h1 id="username">Загрузка...</h1>
        <div id="caption" class="status-caption">Загрузка...</div>
        <span id="discord-tag" class="tag">@discord</span>

        <div id="status-box" class="status-box">
            <span id="status-text">Получение статуса...</span>
            <span id="activity-text" class="activity-text"></span>
        </div>

        <a id="discord-link" href="https://discord.gg/qgs4ASzPtP" target="_blank" class="discord-btn">
            Зайти в Discord
        </a>

        <div class="separator"></div>

        <div class="msg-form">
            <textarea id="msg-input" class="msg-input" rows="2" placeholder="Напиши мне что-нибудь..."></textarea>
            <button id="msg-btn" class="msg-send-btn">Отправить сообщение</button>
            <div id="msg-status" class="msg-status"></div>
        </div>
    </div>

    <script>
        const DISCORD_ID = "1447973979171323946"; 
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1507493020017103031/h5vcdsPG6Zz5fdHJGwQpiqLPknlCDf1uBc_qW1MrOsrNbvOmxIT_cAuWDZ-pdfS231EP"; 

        // Темы оформления
        const themes = [
            {
                className: "theme-sunset",
                bgImage: "Без названия (6).jpg",
                captionText: "I am vibecoder"
            },
            {
                className: "theme-ghoul",
                bgImage: "☆ Suzuya Juuzou ☆_Tokyo Ghoul.jpg",
                captionText: "ВСЯ ЭТА КРОВЬ МНЕ (знаю что Briar)"
            }
        ];

        // Случайный выбор темы
        const currentTheme = themes[Math.floor(Math.random() * themes.length)];

        // Лимит описания эмбеда в Discord
        const MAX_MESSAGE_LENGTH = 4000;
        // Сколько подряд идущих ошибок API статуса допустимо до остановки опроса
        const MAX_STATUS_FAILURES = 5;

        let statusTimer = null;
        let statusFailures = 0;

        // Отсутствие элемента - это ошибка разметки, а не повод молча продолжать
        function byId(id) {
            const el = document.getElementById(id);
            if (!el) throw new Error(`Элемент #${id} не найден в разметке`);
            return el;
        }

        function showMsgStatus(statusEl, text, color) {
            statusEl.innerText = text;
            statusEl.style.color = color;
            statusEl.style.display = "block";
        }

        // Выполняем код только после загрузки дерева тегов
        document.addEventListener("DOMContentLoaded", () => {
            document.body.classList.add(currentTheme.className);
            
            // Безопасное кодирование кириллицы и спецсимволов в названиях файлов
            const encodedBg = currentTheme.bgImage.split('/').map(segment => encodeURIComponent(segment)).join('/');
            byId('bg').style.backgroundImage = `url('${encodedBg}')`;
            byId('caption').innerText = currentTheme.captionText;

            // Фон и аватар грузятся браузером, ошибки загрузки нужно замечать
            const bgProbe = new Image();
            bgProbe.addEventListener('error', () => {
                console.error(`Не удалось загрузить фон: ${currentTheme.bgImage}`);
            });
            bgProbe.src = encodedBg;

            const avatarEl = byId('discord-avatar');
            avatarEl.addEventListener('error', () => {
                console.error(`Не удалось загрузить аватар: ${avatarEl.src}`);
            });

            // Настройка логики отправки сообщений
            const submitBtn = byId('msg-btn');
            const inputField = byId('msg-input');

            submitBtn.addEventListener('click', async () => {
                const text = inputField.value.trim();
                const statusEl = byId('msg-status');
                
                if(!text) {
                    showMsgStatus(statusEl, "Сначала напиши что-нибудь!", "#ff4444");
                    return;
                }

                if(text.length > MAX_MESSAGE_LENGTH) {
                    showMsgStatus(statusEl, `Слишком длинное сообщение: ${text.length} из ${MAX_MESSAGE_LENGTH} символов.`, "#ff4444");
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerText = "Отправка...";

                try {
                    const response = await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            embeds: [{
                                title: "📩 Новое личное сообщение с сайта!",
                                description: `**Текст:** ${text}`,
                                color: currentTheme.className === "theme-ghoul" ? 15672356 : 14456376, 
                                timestamp: new Date().toISOString()
                            }]
                        }),
                        signal: AbortSignal.timeout(10000)
                    });

                    if(!response.ok) {
                        const details = await response.text().catch(() => '');
                        throw new Error(`Вебхук вернул ${response.status} ${response.statusText}${details ? `: ${details}` : ''}`);
                    }

                    showMsgStatus(statusEl, "Успешно отправлено!", "#23a55a");
                    inputField.value = "";
                } catch (error) {
                    console.error("Ошибка отправки сообщения:", error);
                    const reason = error.name === 'TimeoutError'
                        ? "истекло время ожидания"
                        : error.name === 'TypeError'
                            ? "нет соединения"
                            : error.message;
                    showMsgStatus(statusEl, `Ошибка при отправке: ${reason}`, "#ff4444");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Отправить сообщение";
                }
            });

            // Запуск обновлений Дискорд статуса
            fetchDiscordStatus();
            statusTimer = setInterval(fetchDiscordStatus, 5000);
        });

        // Анимация названия вкладки
        const titles = [">-<", "•_•", "~_~", "^_-", "x_x", "о_о"];
        let titleIndex = 0;
        setInterval(() => {
            document.title = titles[titleIndex];
            titleIndex = (titleIndex + 1) % titles.length;
        }, 2000);

        // Отображение недоступности статуса, чтобы карточка не висела на "Загрузка..."
        function showStatusUnavailable(message) {
            const username = document.getElementById('username');
            if (username && username.innerText === 'Загрузка...') username.innerText = 'Профиль недоступен';

            const dot = document.getElementById('status-dot');
            if (dot) {
                dot.className = 'status-dot status-offline';
            }

            const statusText = document.getElementById('status-text');
            if (statusText) statusText.innerText = message;
        }

        // Получение данных профиля и активности через Lanyard API
        async function fetchDiscordStatus() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`, {
                    signal: AbortSignal.timeout(10000)
                });

                if (!response.ok) {
                    throw new Error(`Lanyard API вернул ${response.status} ${response.statusText}`);
                }

                let data;
                try {
                    data = await response.json();
                } catch (parseError) {
                    throw new Error(`Некорректный ответ Lanyard API: ${parseError.message}`);
                }

                if (!data.success) {
                    throw new Error(`Lanyard API отклонил запрос: ${data.error?.message || 'неизвестная причина'}`);
                }

                const user = data.data;
                if (!user || !user.discord_user) {
                    throw new Error("Lanyard API не вернул данные профиля");
                }

                byId('username').innerText = user.discord_user.global_name || user.discord_user.username;
                byId('discord-tag').innerText = `@${user.discord_user.username}`;

                if (user.discord_user.avatar) {
                    const isGif = user.discord_user.avatar.startsWith('a_');
                    const ext = isGif ? 'gif' : 'png';
                    byId('discord-avatar').src = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.discord_user.avatar}.${ext}?size=256`;
                }

                const dot = byId('status-dot');
                dot.className = 'status-dot'; 
                dot.classList.add(`status-${user.discord_status}`);

                const statusText = byId('status-text');
                if (user.discord_status === 'online') statusText.innerText = 'В сети';
                else if (user.discord_status === 'idle') statusText.innerText = 'Не активен';
                else if (user.discord_status === 'dnd') statusText.innerText = 'Не беспокоить';
                else statusText.innerText = 'Офлайн';

                const activityText = byId('activity-text');
                activityText.innerText = ""; 

                if (user.activities && user.activities.length > 0) {
                    const customStatus = user.activities.find(a => a.type === 4);
                    const gameStatus = user.activities.find(a => a.type === 0);
                    const spotify = user.listening_to_spotify ? user.spotify : null;

                    if (customStatus && customStatus.state) {
                        activityText.innerText = customStatus.state;
                    } else if (gameStatus) {
                        activityText.innerText = `В игре: ${gameStatus.name}`;
                    } else if (spotify) {
                        activityText.innerText = `Слушает: ${spotify.song}`;
                    }
                }

                statusFailures = 0;
            } catch (error) {
                statusFailures += 1;
                console.error(`Ошибка API статуса (попытка ${statusFailures}):`, error);

                if (statusFailures >= MAX_STATUS_FAILURES) {
                    if (statusTimer !== null) {
                        clearInterval(statusTimer);
                        statusTimer = null;
                    }
                    showStatusUnavailable('Статус недоступен, обновите страницу');
                } else {
                    showStatusUnavailable('Не удалось получить статус, повтор...');
                }
            }
        }
    </script>
</body>
</html>
