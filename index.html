<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>>-<</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            max-height: 100vh;
            overflow: hidden; /* Полностью запрещает любой скролл на странице */
            position: relative;
        }

        /* Задний фон */
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -2;
            transition: transform 0.5s ease;
        }

        /* Оверлей */
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            transition: background 0.5s ease;
            background: linear-gradient(180deg, var(--overlay-top) 0%, var(--overlay-bottom) 100%);
        }

        /* Основная карточка */
        .bio-card {
            position: relative;
            padding: 35px 25px;
            border-radius: 16px;
            text-align: center;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            width: 320px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: var(--card-bg);
            border: 1px solid rgba(var(--accent-rgb), var(--card-border-alpha));
            box-shadow: 0 40px 100px var(--card-shadow), 0 0 40px rgba(var(--accent-rgb), 0.03);
        }

        .bio-card:hover {
            background: var(--card-bg-hover);
            border-color: rgba(var(--accent-rgb), var(--card-border-alpha-hover));
        }
        
        body:hover .background-image {
            transform: scale(1.02);
        }

        .avatar-container {
            position: relative;
            width: 105px;
            height: 105px;
            margin: 0 auto 25px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(var(--accent-rgb), 0.25);
            transition: border-color 0.5s ease;
        }

        /* Индикатор статуса */
        .status-dot {
            position: absolute;
            bottom: 3px;
            right: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 4px solid var(--dot-border);
            transition: background-color 0.3s ease, border-color 0.5s ease;
        }

        .status-online { background-color: #23a55a; }
        .status-idle { background-color: #f0b232; }
        .status-dnd { background-color: #f23f43; }
        .status-offline { background-color: #747f8d; }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 4px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        /* Текст статуса */
        .status-caption {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
            transition: color 0.5s ease, text-shadow 0.5s ease;
            color: var(--accent);
            text-shadow: 0 0 10px var(--caption-glow);
        }

        .tag {
            font-weight: 400;
            font-size: 0.8rem;
            margin-bottom: 20px;
            display: block;
            letter-spacing: 0.5px;
            transition: color 0.5s ease;
            color: var(--tag-color);
        }

        .status-box {
            font-size: 0.85rem;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            background: var(--box-bg);
            border: 1px solid rgba(var(--accent-rgb), var(--box-border-alpha));
            color: var(--box-color);
            transition: background 0.5s ease, border-color 0.5s ease, color 0.5s ease;
        }

        .activity-text {
            font-size: 0.75rem;
            transition: color 0.5s ease;
            color: var(--activity-color);
        }

        /* Кнопка ссылки на Дискорд */
        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            background: rgba(var(--accent-rgb), var(--btn-bg-alpha));
            border: 1px solid rgba(var(--accent-rgb), 0.25);
            color: var(--accent);
            box-shadow: 0 0 15px rgba(var(--accent-rgb), 0.1);
            transition: all 0.3s ease;
        }

        .discord-btn:hover {
            transform: scale(1.02);
            background: rgba(var(--accent-rgb), 0.2);
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.4);
        }

        /* Разделитель */
        .separator {
            height: 1px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        /* Блок формы вебхука */
        .msg-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .msg-input {
            width: 100%;
            box-sizing: border-box; /* Чтобы отступы не распирали карточку */
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 0.8rem;
            outline: none;
            resize: none;
            font-family: inherit;
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        .msg-input:focus {
            background: rgba(0, 0, 0, 0.6);
            border-color: rgba(var(--accent-rgb), 0.4);
        }

        .msg-send-btn {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            background: var(--accent);
            color: var(--btn-text);
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .msg-send-btn:hover {
            transform: scale(1.01);
        }

        .msg-status {
            font-size: 0.75rem;
            margin-top: 4px;
            display: none;
        }

        /* --- ТЕМА 1 (ЗАКАТ) --- */
        .theme-sunset {
            --accent: #dd9c5a;
            --accent-rgb: 220, 150, 80;
            --caption-glow: rgba(221, 156, 90, 0.2);
            --overlay-top: rgba(15, 10, 5, 0.5);
            --overlay-bottom: rgba(5, 3, 0, 0.85);
            --card-bg: rgba(18, 14, 10, 0.65);
            --card-bg-hover: rgba(22, 16, 12, 0.75);
            --card-shadow: rgba(0, 0, 0, 0.9);
            --card-border-alpha: 0.15;
            --card-border-alpha-hover: 0.3;
            --dot-border: #18120e;
            --tag-color: rgba(220, 180, 150, 0.35);
            --box-bg: rgba(10, 7, 5, 0.5);
            --box-border-alpha: 0.06;
            --box-color: #f3e8de;
            --activity-color: #a89485;
            --btn-bg-alpha: 0.1;
            --btn-text: #120e0a;
        }

        /* --- ТЕМА 2 (ГУЛЬ / БРАЙАР) --- */
        .theme-ghoul {
            --accent: #ef4444;
            --accent-rgb: 239, 68, 68;
            --caption-glow: rgba(239, 68, 68, 0.4);
            --overlay-top: rgba(20, 0, 0, 0.55);
            --overlay-bottom: rgba(5, 0, 0, 0.9);
            --card-bg: rgba(12, 5, 5, 0.7);
            --card-bg-hover: rgba(16, 6, 6, 0.8);
            --card-shadow: rgba(0, 0, 0, 0.95);
            --card-border-alpha: 0.15;
            --card-border-alpha-hover: 0.35;
            --dot-border: #0c0505;
            --tag-color: rgba(239, 150, 150, 0.3);
            --box-bg: rgba(10, 4, 4, 0.6);
            --box-border-alpha: 0.08;
            --box-color: #fca5a5;
            --activity-color: #f87171;
            --btn-bg-alpha: 0.08;
            --btn-text: #ffffff;
        }
    </style>
</head>
<body>

    <div id="bg" class="background-image"></div>
    <div id="overlay" class="background-overlay"></div>

    <div id="card" class="bio-card">
        <div class="avatar-container">
            <img id="discord-avatar" class="avatar" src="https://archive.org/download/discord-loading-dots-discord-loading/discord-loading-dots-discord-loading.gif" alt="Avatar">
            <div id="status-dot" class="status-dot"></div>
        </div>
        
        <h1 id="username">Загрузка...</h1>
        <div id="caption" class="status-caption">Загрузка...</div>
        <span id="discord-tag" class="tag">@discord</span>

        <div id="status-box" class="status-box">
            <span id="status-text">Получение статуса...</span>
            <span id="activity-text" class="activity-text"></span>
        </div>

        <a id="discord-link" href="https://discord.gg/qgs4ASzPtP" target="_blank" class="discord-btn">
            Зайти в Discord
        </a>

        <div class="separator"></div>

        <div class="msg-form">
            <textarea id="msg-input" class="msg-input" rows="2" placeholder="Напиши мне что-нибудь..."></textarea>
            <button id="msg-btn" class="msg-send-btn">Отправить сообщение</button>
            <div id="msg-status" class="msg-status"></div>
        </div>
    </div>

    <script>
        const DISCORD_ID = "1447973979171323946"; 
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1507493020017103031/h5vcdsPG6Zz5fdHJGwQpiqLPknlCDf1uBc_qW1MrOsrNbvOmxIT_cAuWDZ-pdfS231EP"; 

        // Темы оформления
        const themes = [
            {
                className: "theme-sunset",
                bgImage: "Без названия (6).jpg",
                captionText: "I am vibecoder",
                embedColor: 14456376
            },
            {
                className: "theme-ghoul",
                bgImage: "☆ Suzuya Juuzou ☆_Tokyo Ghoul.jpg",
                captionText: "ВСЯ ЭТА КРОВЬ МНЕ (знаю что Briar)",
                embedColor: 15672356
            }
        ];

        // Названия статусов Дискорда
        const STATUS_LABELS = {
            online: "В сети",
            idle: "Не активен",
            dnd: "Не беспокоить",
            offline: "Офлайн"
        };

        const COLOR_ERROR = "#ff4444";
        const COLOR_SUCCESS = "#23a55a";
        const SEND_BTN_LABEL = "Отправить сообщение";

        // Общие утилиты
        const byId = (id) => document.getElementById(id);

        const setText = (id, text) => { byId(id).innerText = text; };

        // Показ сообщения под формой
        function showFormStatus(text, color) {
            const statusEl = byId('msg-status');
            statusEl.innerText = text;
            statusEl.style.color = color;
            statusEl.style.display = "block";
        }

        // Состояние кнопки отправки
        function setSendingState(btn, isSending) {
            btn.disabled = isSending;
            btn.innerText = isSending ? "Отправка..." : SEND_BTN_LABEL;
        }

        // Случайный выбор темы
        const currentTheme = themes[Math.floor(Math.random() * themes.length)];

        // Выполняем код только после загрузки дерева тегов
        document.addEventListener("DOMContentLoaded", () => {
            document.body.classList.add(currentTheme.className);
            
            // Безопасное кодирование кириллицы и спецсимволов в названиях файлов
            const encodedBg = currentTheme.bgImage.split('/').map(segment => encodeURIComponent(segment)).join('/');
            byId('bg').style.backgroundImage = `url('${encodedBg}')`;
            setText('caption', currentTheme.captionText);

            // Настройка логики отправки сообщений
            const submitBtn = byId('msg-btn');
            const inputField = byId('msg-input');

            submitBtn.addEventListener('click', async () => {
                const text = inputField.value.trim();

                if(!text) {
                    showFormStatus("Сначала напиши что-нибудь!", COLOR_ERROR);
                    return;
                }

                setSendingState(submitBtn, true);

                try {
                    const response = await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            embeds: [{
                                title: "📩 Новое личное сообщение с сайта!",
                                description: `**Текст:** ${text}`,
                                color: currentTheme.embedColor,
                                timestamp: new Date()
                            }]
                        })
                    });

                    if(!response.ok) throw new Error(`HTTP ${response.status}`);

                    showFormStatus("Успешно отправлено!", COLOR_SUCCESS);
                    inputField.value = "";
                } catch (e) {
                    showFormStatus("Ошибка при отправке.", COLOR_ERROR);
                } finally {
                    setSendingState(submitBtn, false);
                }
            });

            // Запуск обновлений Дискорд статуса
            fetchDiscordStatus();
            setInterval(fetchDiscordStatus, 5000);
        });

        // Анимация названия вкладки
        const titles = [">-<", "•_•", "~_~", "^_-", "x_x", "о_о"];
        let titleIndex = 0;
        setInterval(() => {
            document.title = titles[titleIndex];
            titleIndex = (titleIndex + 1) % titles.length;
        }, 2000);

        // Получение данных профиля и активности через Lanyard API
        async function fetchDiscordStatus() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const data = await response.json();
                
                if (data.success) {
                    const user = data.data;
                    setText('username', user.discord_user.global_name || user.discord_user.username);
                    setText('discord-tag', `@${user.discord_user.username}`);

                    if (user.discord_user.avatar) {
                        const ext = user.discord_user.avatar.startsWith('a_') ? 'gif' : 'png';
                        byId('discord-avatar').src = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.discord_user.avatar}.${ext}?size=256`;
                    }

                    const dot = byId('status-dot');
                    dot.className = 'status-dot'; 
                    dot.classList.add(`status-${user.discord_status}`);

                    setText('status-text', STATUS_LABELS[user.discord_status] || STATUS_LABELS.offline);
                    setText('activity-text', describeActivity(user));
                }
            } catch (error) {
                console.error("Ошибка API статуса:", error);
            }
        }

        // Выбор приоритетной активности пользователя
        function describeActivity(user) {
            const activities = user.activities || [];
            const customStatus = activities.find(a => a.type === 4);
            const gameStatus = activities.find(a => a.type === 0);

            if (customStatus && customStatus.state) return customStatus.state;
            if (gameStatus) return `В игре: ${gameStatus.name}`;
            if (user.listening_to_spotify && user.spotify) return `Слушает: ${user.spotify.song}`;
            return "";
        }
    </script>
</body>
</html>
