<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>>-<</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            cursor: pointer; /* Показываем, что на сайт можно кликнуть */
        }

        /* Задний фон: Видео с облаками */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
        }

        /* Темная маска поверх видео */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        /* Карточка */
        .bio-card {
            position: relative;
            background: rgba(10, 10, 12, 0.45);
            padding: 40px 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9);
            width: 310px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .bio-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.1);
            background: rgba(10, 10, 12, 0.6);
        }

        .avatar-container {
            position: relative;
            width: 105px;
            height: 105px;
            margin: 0 auto 25px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #111113;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Индикатор статуса */
        .status-dot {
            position: absolute;
            bottom: 3px;
            right: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 4px solid #0d0d11;
            background-color: #747f8d;
            transition: background-color 0.3s ease;
        }

        /* Цвета статусов */
        .status-online { background-color: #23a55a; }
        .status-idle { background-color: #f0b232; }
        .status-dnd { background-color: #f23f43; }
        .status-offline { background-color: #747f8d; }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 4px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #f4f4f5;
        }

        .status-caption {
            display: inline-block;
            font-size: 0.95rem;
            font-weight: 500;
            color: #a1a1aa;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .tag {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 400;
            font-size: 0.8rem;
            margin-bottom: 25px;
            display: block;
            letter-spacing: 0.5px;
        }

        .status-box {
            font-size: 0.85rem;
            color: #d4d4d8;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            justify-content: center;
        }

        .activity-text {
            font-size: 0.75rem;
            color: #71717a;
        }

        /* Подсказка для звука */
        .audio-hint {
            position: absolute;
            bottom: 15px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.5px;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <audio id="notification-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-600.wav" preload="auto"></audio>

    <video class="video-background" autoplay loop muted playsinline>
        <source src="https://assets.mixkit.co/videos/preview/mixkit-dark-clouds-in-the-night-sky-40348-large.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="bio-card">
        <div class="avatar-container">
            <img id="discord-avatar" class="avatar" src="https://archive.org/download/discord-loading-dots-discord-loading/discord-loading-dots-discord-loading.gif" alt="Avatar">
            <div id="status-dot" class="status-dot"></div>
        </div>
        
        <h1 id="username">Загрузка...</h1>
        <div class="status-caption">I am vibecoder</div>
        <span id="discord-tag" class="tag">@discord</span>

        <div class="status-box">
            <span id="status-text">Получение статуса...</span>
            <span id="activity-text" class="activity-text"></span>
        </div>
    </div>

    <div id="audio-hint" class="audio-hint">Кликни в любом месте для включения аудио-атмосферы</div>

    <script>
        const DISCORD_ID = "1447973979171323946"; 
        let lastStatus = null;
        let lastActivity = null;
        let audioAllowed = false;

        // Разрешаем звук после первого клика пользователя по сайту
        document.body.addEventListener('click', () => {
            audioAllowed = true;
            const hint = document.getElementById('audio-hint');
            if (hint) hint.style.opacity = '0'; // Прячем подсказку
        });

        // Функция воспроизведения звука
        function playNotification() {
            if (audioAllowed) {
                const sound = document.getElementById('notification-sound');
                sound.currentTime = 0; // Сброс на начало
                sound.play().catch(e => console.log("Браузер заблокировал звук:", e));
            }
        }

        // Анимация вкладки
        const titles = [">-<", "•_•", "~_~", "^_-", "x_x", "о_о"];
        let titleIndex = 0;
        setInterval(() => {
            document.title = titles[titleIndex];
            titleIndex = (titleIndex + 1) % titles.length;
        }, 2000);

        // Получение данных Discord
        async function fetchDiscordStatus() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const data = await response.json();
                
                if (data.success) {
                    const user = data.data;
                    
                    document.getElementById('username').innerText = user.discord_user.global_name || user.discord_user.username;
                    document.getElementById('discord-tag').innerText = `@${user.discord_user.username}`;
                    
                    if (user.discord_user.avatar) {
                        const isGif = user.discord_user.avatar.startsWith('a_');
                        const ext = isGif ? 'gif' : 'png';
                        document.getElementById('discord-avatar').src = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.discord_user.avatar}.${ext}?size=256`;
                    }
                    
                    const dot = document.getElementById('status-dot');
                    dot.className = 'status-dot'; 
                    dot.classList.add(`status-${user.discord_status}`);
                    
                    const statusText = document.getElementById('status-text');
                    let currentStatusString = '';
                    if (user.discord_status === 'online') currentStatusString = 'В сети';
                    else if (user.discord_status === 'idle') currentStatusString = 'Не активен';
                    else if (user.discord_status === 'dnd') currentStatusString = 'Не беспокоить';
                    else currentStatusString = 'Офлайн';
                    
                    statusText.innerText = currentStatusString;
                    
                    const activityText = document.getElementById('activity-text');
                    let currentActivityString = ""; 
                    
                    if (user.activities && user.activities.length > 0) {
                        const customStatus = user.activities.find(a => a.type === 4);
                        const gameStatus = user.activities.find(a => a.type === 0);
                        const spotify = user.listening_to_spotify ? user.spotify : null;

                        if (customStatus && customStatus.state) {
                            currentActivityString = customStatus.state;
                        } else if (gameStatus) {
                            currentActivityString = `В игре: ${gameStatus.name}`;
                        } else if (spotify) {
                            currentActivityString = `Слушает: ${spotify.song}`;
                        }
                    }
                    
                    activityText.innerText = currentActivityString;

                    // ПРОВЕРКА НА ИЗМЕНЕНИЯ (если статус или активность изменились — играет звук)
                    if (lastStatus !== null && (lastStatus !== user.discord_status || lastActivity !== currentActivityString)) {
                        playNotification();
                    }

                    // Сохраняем текущее состояние для следующей проверки
                    lastStatus = user.discord_status;
                    lastActivity = currentActivityString;
                }
            } catch (error) {
                console.error("Ошибка API:", error);
            }
        }

        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, 5000);
    </script>
</body>
</html>
