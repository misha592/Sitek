<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>>-<</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Динамический фон из репозитория */
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -2;
            transition: transform 0.5s ease;
        }

        /* Мрачное тёмно-красное наложение */
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(20, 0, 0, 0.55) 0%, rgba(5, 0, 0, 0.9) 100%);
            z-index: -1;
        }

        /* Суровая карточка в стиле Токийского Гуля */
        .bio-card {
            position: relative;
            background: rgba(12, 5, 5, 0.7);
            padding: 40px 30px;
            border-radius: 16px;
            border: 1px solid rgba(239, 68, 68, 0.15); /* Кроваво-красная рамка */
            text-align: center;
            backdrop-filter: blur(14px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.95), 0 0 40px rgba(239, 68, 68, 0.03);
            width: 310px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        body:hover .background-image {
            transform: scale(1.02);
        }

        .bio-card:hover {
            transform: translateY(-4px);
            border-color: rgba(239, 68, 68, 0.35);
            background: rgba(16, 6, 6, 0.8);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.95), 0 0 30px rgba(239, 68, 68, 0.08);
        }

        .avatar-container {
            position: relative;
            width: 105px;
            height: 105px;
            margin: 0 auto 25px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #140808;
            border: 2px solid rgba(239, 68, 68, 0.25); /* Красный ободок аватарки */
        }

        /* Индикатор статуса */
        .status-dot {
            position: absolute;
            bottom: 3px;
            right: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 4px solid #0c0505;
            background-color: #747f8d;
            transition: background-color 0.3s ease;
        }

        .status-online { background-color: #23a55a; }
        .status-idle { background-color: #f0b232; }
        .status-dnd { background-color: #f23f43; }
        .status-offline { background-color: #747f8d; }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 4px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff1f1;
        }

        /* Твое кастомное описание */
        .status-caption {
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 700;
            color: #ef4444; /* Кроваво-красный текст */
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }

        .tag {
            color: rgba(239, 150, 150, 0.3);
            font-weight: 400;
            font-size: 0.8rem;
            margin-bottom: 25px;
            display: block;
            letter-spacing: 0.5px;
        }

        .status-box {
            font-size: 0.85rem;
            color: #fca5a5;
            background: rgba(10, 4, 4, 0.6);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.08);
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            justify-content: center;
        }

        .activity-text {
            font-size: 0.75rem;
            color: #f87171;
        }
    </style>
</head>
<body>

    <div id="bg" class="background-image"></div>
    <div class="background-overlay"></div>

    <div class="bio-card">
        <div class="avatar-container">
            <img id="discord-avatar" class="avatar" src="https://archive.org/download/discord-loading-dots-discord-loading/discord-loading-dots-discord-loading.gif" alt="Avatar">
            <div id="status-dot" class="status-dot"></div>
        </div>
        
        <h1 id="username">Загрузка...</h1>
        <div class="status-caption">ВСЯ ЭТА КРОВЬ МНЕ</div>
        <span id="discord-tag" class="tag">@discord</span>

        <div class="status-box">
            <span id="status-text">Получение статуса...</span>
            <span id="activity-text" class="activity-text"></span>
        </div>
    </div>

    <script>
        const DISCORD_ID = "1447973979171323946"; 

        // --- ЛОГИКА РАНДОМНОГО ФОНА ---
        // Закодированные пути к твоим файлам на гитхабе, чтобы пробелы и звездочки не ломали код
        const backgroundImages = [
            "%D0%91%D0%B5%D0%B7%20%D0%BD%D0%B0%D0%B7%D0%B2%D0%B0%D0%BD%D0%B8%D1%8F%20(6).jpg",
            "%E2%98%86%20Suzuya%20Juuzou%20%E2%98%86_Tokyo%20Ghoul.jpg"
        ];
        
        // Выбираем случайный из двух
        const randomBg = backgroundImages[Math.floor(Math.random() * backgroundImages.length)];
        document.getElementById('bg').style.backgroundImage = `url('${randomBg}')`;

        // Смена смайликов во вкладке
        const titles = [">-<", "•_•", "~_~", "^_-", "x_x", "о_о"];
        let titleIndex = 0;
        setInterval(() => {
            document.title = titles[titleIndex];
            titleIndex = (titleIndex + 1) % titles.length;
        }, 2000);

        // Получение данных Discord
        async function fetchDiscordStatus() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const data = await response.json();
                
                if (data.success) {
                    const user = data.data;
                    
                    document.getElementById('username').innerText = user.discord_user.global_name || user.discord_user.username;
                    document.getElementById('discord-tag').innerText = `@${user.discord_user.username}`;
                    
                    if (user.discord_user.avatar) {
                        const isGif = user.discord_user.avatar.startsWith('a_');
                        const ext = isGif ? 'gif' : 'png';
                        document.getElementById('discord-avatar').src = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.discord_user.avatar}.${ext}?size=256`;
                    }
                    
                    const dot = document.getElementById('status-dot');
                    dot.className = 'status-dot'; 
                    dot.classList.add(`status-${user.discord_status}`);
                    
                    const statusText = document.getElementById('status-text');
                    if (user.discord_status === 'online') statusText.innerText = 'В сети';
                    else if (user.discord_status === 'idle') statusText.innerText = 'Не активен';
                    else if (user.discord_status === 'dnd') statusText.innerText = 'Не беспокоить';
                    else statusText.innerText = 'Офлайн';
                    
                    const activityText = document.getElementById('activity-text');
                    activityText.innerText = ""; 
                    
                    if (user.activities && user.activities.length > 0) {
                        const customStatus = user.activities.find(a => a.type === 4);
                        const gameStatus = user.activities.find(a => a.type === 0);
                        const spotify = user.listening_to_spotify ? user.spotify : null;

                        if (customStatus && customStatus.state) {
                            activityText.innerText = customStatus.state;
                        } else if (gameStatus) {
                            activityText.innerText = `В игре: ${gameStatus.name}`;
                        } else if (spotify) {
                            activityText.innerText = `Слушает: ${spotify.song}`;
                        }
                    }
                }
            } catch (error) {
                console.error("Ошибка API:", error);
            }
        }

        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, 5000);
    </script>
</body>
</html>
