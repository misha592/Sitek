<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>>-<</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden; /* Запрет горизонтального скролла */
            position: relative;
        }

        /* Задний фон */
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -2;
            transition: transform 0.5s ease;
        }

        /* Оверлей */
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            transition: background 0.5s ease;
        }

        /* Основная карточка */
        .bio-card {
            position: relative;
            padding: 30px 25px;
            border-radius: 16px;
            text-align: center;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            width: 320px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            margin: 20px 0;
            border: 1px solid transparent;
        }
        
        body:hover .background-image {
            transform: scale(1.02);
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            transition: border-color 0.5s ease;
        }

        /* Статус */
        .status-dot {
            position: absolute;
            bottom: 3px;
            right: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 4px solid transparent;
            transition: background-color 0.3s ease, border-color 0.5s ease;
        }

        .status-online { background-color: #23a55a; }
        .status-idle { background-color: #f0b232; }
        .status-dnd { background-color: #f23f43; }
        .status-offline { background-color: #747f8d; }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 4px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .status-caption {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        .tag {
            font-weight: 400;
            font-size: 0.8rem;
            margin-bottom: 15px;
            display: block;
            letter-spacing: 0.5px;
            transition: color 0.5s ease;
        }

        .status-box {
            font-size: 0.8rem;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border: 1px solid transparent;
            transition: background 0.5s ease, border-color 0.5s ease, color 0.5s ease;
        }

        .activity-text {
            font-size: 0.75rem;
            transition: color 0.5s ease;
        }

        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .discord-btn:hover {
            transform: scale(1.02);
        }

        .separator {
            height: 1px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 15px;
        }

        /* --- БЛОК С ОФИЦИАЛЬНЫМИ ПЛЕЕРАМИ --- */
        .player-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
        }

        .player-container iframe {
            border-radius: 12px;
            border: none;
            width: 100%;
        }

        /* Форма сообщений */
        .msg-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .msg-input {
            width: 100%;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 0.8rem;
            outline: none;
            resize: none;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .msg-send-btn {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .msg-send-btn:hover {
            transform: scale(1.01);
        }

        .msg-status {
            font-size: 0.75rem;
            margin-top: 4px;
            display: none;
        }

        /* --- СТИЛИ ТЕМЫ 1 (ЗАКАТ) --- */
        .theme-sunset .background-overlay { background: linear-gradient(180deg, rgba(15, 10, 5, 0.5) 0%, rgba(5, 3, 0, 0.85) 100%); }
        .theme-sunset .bio-card { background: rgba(18, 14, 10, 0.65); border: 1px solid rgba(220, 150, 80, 0.15); box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9); }
        .theme-sunset .avatar { border-color: rgba(220, 150, 80, 0.25); }
        .theme-sunset .status-dot { border-color: #18120e; }
        .theme-sunset .status-caption { color: #dd9c5a; text-shadow: 0 0 10px rgba(221, 156, 90, 0.2); }
        .theme-sunset .tag { color: rgba(220, 180, 150, 0.35); }
        .theme-sunset .status-box { background: rgba(10, 7, 5, 0.5); border-color: rgba(220, 150, 80, 0.06); color: #f3e8de; }
        .theme-sunset .activity-text { color: #a89485; }
        .theme-sunset .discord-btn { background: rgba(220, 150, 80, 0.1); border-color: rgba(220, 150, 80, 0.25); color: #dd9c5a; }
        .theme-sunset .msg-input:focus { border-color: rgba(220, 150, 80, 0.4); }
        .theme-sunset .msg-send-btn { background: #dd9c5a; color: #120e0a; }

        /* --- СТИЛИ ТЕМЫ 2 (ГУЛЬ / БРАЙАР) --- */
        .theme-ghoul .background-overlay { background: linear-gradient(180deg, rgba(20, 0, 0, 0.55) 0%, rgba(5, 0, 0, 0.9) 100%); }
        .theme-ghoul .bio-card { background: rgba(12, 5, 5, 0.7); border: 1px solid rgba(239, 68, 68, 0.15); box-shadow: 0 40px 100px rgba(0, 0, 0, 0.95); }
        .theme-ghoul .avatar { border-color: rgba(239, 68, 68, 0.25); }
        .theme-ghoul .status-dot { border-color: #0c0505; }
        .theme-ghoul .status-caption { color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
        .theme-ghoul .tag { color: rgba(239, 150, 150, 0.3); }
        .theme-ghoul .status-box { background: rgba(10, 4, 4, 0.6); border-color: rgba(239, 68, 68, 0.08); color: #fca5a5; }
        .theme-ghoul .activity-text { color: #f87171; }
        .theme-ghoul .discord-btn { background: rgba(239, 68, 68, 0.08); border-color: rgba(239, 68, 68, 0.25); color: #ef4444; }
        .theme-ghoul .msg-input:focus { border-color: rgba(239, 68, 68, 0.4); }
        .theme-ghoul .msg-send-btn { background: #ef4444; color: #ffffff; }
    </style>
</head>
<body>

    <div id="bg" class="background-image"></div>
    <div id="overlay" class="background-overlay"></div>

    <div id="card" class="bio-card">
        <div class="avatar-container">
            <img id="discord-avatar" class="avatar" src="https://archive.org/download/discord-loading-dots-discord-loading/discord-loading-dots-discord-loading.gif" alt="Avatar">
            <div id="status-dot" class="status-dot"></div>
        </div>
        
        <h1 id="username">Загрузка...</h1>
        <div id="caption" class="status-caption">Загрузка...</div>
        <span id="discord-tag" class="tag">@discord</span>

        <div id="status-box" class="status-box">
            <span id="status-text">Получение статуса...</span>
            <span id="activity-text" class="activity-text"></span>
        </div>

        <a id="discord-link" href="https://discord.gg/qgs4ASzPtP" target="_blank" class="discord-btn">
            Зайти в Discord
        </a>

        <div class="separator"></div>

        <div class="player-container">
            <iframe src="https://open.spotify.com/embed/track/2TpxZ7JUBn3uw46667p6Fx?utm_source=generator&theme=0" height="80" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            
            <iframe height="150" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/499117260&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=false"></iframe>
        </div>

        <div class="separator"></div>

        <div class="msg-form">
            <textarea id="msg-input" class="msg-input" rows="2" placeholder="Напиши мне что-нибудь..."></textarea>
            <button id="msg-btn" class="msg-send-btn">Отправить сообщение</button>
            <div id="msg-status" class="msg-status"></div>
        </div>
    </div>

    <script>
        const DISCORD_ID = "1447973979171323946"; 
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1507493020017103031/h5vcdsPG6Zz5fdHJGwQpiqLPknlCDf1uBc_qW1MrOsrNbvOmxIT_cAuWDZ-pdfS231EP"; 

        const themes = [
            {
                className: "theme-sunset",
                bgImage: "Без названия (6).jpg",
                captionText: "I am vibecoder"
            },
            {
                className: "theme-ghoul",
                bgImage: "☆ Suzuya Juuzou ☆_Tokyo Ghoul.jpg",
                captionText: "ВСЯ ЭТА КРОВЬ МНЕ (знаю что Briar)"
            }
        ];

        const currentTheme = themes[Math.floor(Math.random() * themes.length)];

        document.addEventListener("DOMContentLoaded", () => {
            document.body.classList.add(currentTheme.className);
            
            const encodedBg = currentTheme.bgImage.split('/').map(segment => encodeURIComponent(segment)).join('/');
            document.getElementById('bg').style.backgroundImage = `url('${encodedBg}')`;
            document.getElementById('caption').innerText = currentTheme.captionText;

            // Логика вебхука
            const submitBtn = document.getElementById('msg-btn');
            const inputField = document.getElementById('msg-input');

            submitBtn.addEventListener('click', async () => {
                const text = inputField.value.trim();
                const statusEl = document.getElementById('msg-status');
                
                if(!text) {
                    statusEl.innerText = "Сначала напиши что-нибудь!";
                    statusEl.style.color = "#ff4444";
                    statusEl.style.display = "block";
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerText = "Отправка...";

                try {
                    const response = await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            embeds: [{
                                title: "📩 Новое личное сообщение с сайта!",
                                description: `**Текст:** ${text}`,
                                color: currentTheme.className === "theme-ghoul" ? 15672356 : 14456376, 
                                timestamp: new Date()
                            }]
                        })
                    });

                    if(response.ok) {
                        statusEl.innerText = "Успешно отправлено!";
                        statusEl.style.color = "#23a55a";
                        statusEl.style.display = "block";
                        inputField.value = ""; 
                    } else {
                        throw new Error();
                    }
                } catch (e) {
                    statusEl.innerText = "Ошибка при отправке.";
                    statusEl.style.color = "#ff4444";
                    statusEl.style.display = "block";
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Отправить сообщение";
                }
            });

            fetchDiscordStatus();
            setInterval(fetchDiscordStatus, 5000);
        });

        const titles = [">-<", "•_•", "~_~", "^_-", "x_x", "о_о"];
        let titleIndex = 0;
        setInterval(() => {
            document.title = titles[titleIndex];
            titleIndex = (titleIndex + 1) % titles.length;
        }, 2000);

        async function fetchDiscordStatus() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const data = await response.json();
                
                if (data.success) {
                    const user = data.data;
                    document.getElementById('username').innerText = user.discord_user.global_name || user.discord_user.username;
                    document.getElementById('discord-tag').innerText = `@${user.discord_user.username}`;
                    
                    if (user.discord_user.avatar) {
                        const isGif = user.discord_user.avatar.startsWith('a_');
                        const ext = isGif ? 'gif' : 'png';
                        document.getElementById('discord-avatar').src = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.discord_user.avatar}.${ext}?size=256`;
                    }
                    
                    const dot = document.getElementById('status-dot');
                    dot.className = 'status-dot'; 
                    dot.classList.add(`status-${user.discord_status}`);
                    
                    const statusText = document.getElementById('status-text');
                    if (user.discord_status === 'online') statusText.innerText = 'В сети';
                    else if (user.discord_status === 'idle') statusText.innerText = 'Не активен';
                    else if (user.discord_status === 'dnd') statusText.innerText = 'Не беспокоить';
                    else statusText.innerText = 'Офлайн';
                    
                    const activityText = document.getElementById('activity-text');
                    activityText.innerText = ""; 
                    
                    if (user.activities && user.activities.length > 0) {
                        const customStatus = user.activities.find(a => a.type === 4);
                        const gameStatus = user.activities.find(a => a.type === 0);
                        const spotify = user.listening_to_spotify ? user.spotify : null;

                        if (customStatus && customStatus.state) {
                            activityText.innerText = customStatus.state;
                        } else if (gameStatus) {
                            activityText.innerText = `В игре: ${gameStatus.name}`;
                        } else if (spotify) {
                            activityText.innerText = `Слушает: ${spotify.song}`;
                        }
                    }
                }
            } catch (error) {
                console.error("Ошибка API статуса:", error);
            }
        }
    </script>
</body>
</html>
