<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>>-<</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #070709;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Задний фон с легким неоновым свечением */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(88, 101, 242, 0.15);
            filter: blur(120px);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .bio-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.02);
            padding: 40px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            width: 300px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        
        .bio-card:hover {
            transform: translateY(-5px);
            border-color: rgba(88, 101, 242, 0.2);
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #1e1f22;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* Индикатор статуса */
        .status-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 4px solid #070709;
            background-color: #747f8d;
            transition: background-color 0.3s ease;
        }

        /* Цвета статусов Дискорда */
        .status-online { background-color: #23a55a; }
        .status-idle { background-color: #f0b232; }
        .status-dnd { background-color: #f23f43; }
        .status-offline { background-color: #747f8d; }

        h1 {
            font-size: 1.7rem;
            margin: 10px 0 5px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Стильная неоновая надпись I am vibecoder */
        .status-caption {
            display: inline-block;
            font-size: 1.05rem;
            font-weight: 600;
            background: linear-gradient(45deg, #8a2be2, #5865F2, #00c6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .tag {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 25px;
            display: block;
            letter-spacing: 0.5px;
        }

        .status-box {
            font-size: 0.9rem;
            color: #e4e4e7;
            background: rgba(255, 255, 255, 0.03);
            padding: 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
            justify-content: center;
        }

        .activity-text {
            font-size: 0.8rem;
            color: #a1a1aa;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="bio-card">
        <div class="avatar-container">
            <img id="discord-avatar" class="avatar" src="https://archive.org/download/discord-loading-dots-discord-loading/discord-loading-dots-discord-loading.gif" alt="Avatar">
            <div id="status-dot" class="status-dot"></div>
        </div>
        
        <h1 id="username">Загрузка...</h1>
        <div class="status-caption">I am vibecoder</div>
        <span id="discord-tag" class="tag">@discord</span>

        <div class="status-box">
            <span id="status-text">Получение статуса...</span>
            <span id="activity-text" class="activity-text"></span>
        </div>
    </div>

    <script>
        const DISCORD_ID = "1447973979171323946"; 

        // --- АНИМАЦИЯ НАЗВАНИЯ ВКЛАДКИ БРАУЗЕРА ---
        const titles = [">-<", "•_•", "~_~", "^_-", "x_x", "о_о"];
        let titleIndex = 0;
        setInterval(() => {
            document.title = titles[titleIndex];
            titleIndex = (titleIndex + 1) % titles.length;
        }, 2000); // Смена смайлика каждые 2 секунды

        // --- ПОЛУЧЕНИЕ СТАТУСА ИЗ DISCORD ---
        async function fetchDiscordStatus() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const data = await response.json();
                
                if (data.success) {
                    const user = data.data;
                    
                    document.getElementById('username').innerText = user.discord_user.global_name || user.discord_user.username;
                    document.getElementById('discord-tag').innerText = `@${user.discord_user.username}`;
                    
                    if (user.discord_user.avatar) {
                        const isGif = user.discord_user.avatar.startsWith('a_');
                        const ext = isGif ? 'gif' : 'png';
                        document.getElementById('discord-avatar').src = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.discord_user.avatar}.${ext}?size=256`;
                    }
                    
                    const dot = document.getElementById('status-dot');
                    dot.className = 'status-dot'; 
                    dot.classList.add(`status-${user.discord_status}`);
                    
                    const statusText = document.getElementById('status-text');
                    if (user.discord_status === 'online') statusText.innerText = 'В сети';
                    else if (user.discord_status === 'idle') statusText.innerText = 'Не активен';
                    else if (user.discord_status === 'dnd') statusText.innerText = 'Не беспокоить';
                    else statusText.innerText = 'Офлайн';
                    
                    const activityText = document.getElementById('activity-text');
                    activityText.innerText = ""; 
                    
                    if (user.activities && user.activities.length > 0) {
                        const customStatus = user.activities.find(a => a.type === 4);
                        const gameStatus = user.activities.find(a => a.type === 0);
                        const spotify = user.listening_to_spotify ? user.spotify : null;

                        if (customStatus && customStatus.state) {
                            activityText.innerText = customStatus.state;
                        } else if (gameStatus) {
                            activityText.innerText = `Играет в ${gameStatus.name}`;
                        } else if (spotify) {
                            activityText.innerText = `Слушает ${spotify.song}`;
                        }
                    }
                }
            } catch (error) {
                console.error("Ошибка API:", error);
            }
        }

        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, 5000); // Обновление статуса каждые 5 секунд
    </script>
</body>
</html>
