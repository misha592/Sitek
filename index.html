<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>>-<</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Задний фон */
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -2;
            transition: transform 0.5s ease;
        }

        /* Оверлей */
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            transition: background 0.5s ease;
        }

        /* Основная карточка */
        .bio-card {
            position: relative;
            padding: 35px 25px;
            border-radius: 16px;
            text-align: center;
            backdrop-filter: blur(14px);
            width: 320px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            margin: 20px 0;
        }
        
        body:hover .background-image {
            transform: scale(1.02);
        }

        .avatar-container {
            position: relative;
            width: 105px;
            height: 105px;
            margin: 0 auto 25px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            transition: border-color 0.5s ease;
        }

        /* Индикатор статуса */
        .status-dot {
            position: absolute;
            bottom: 3px;
            right: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            transition: background-color 0.3s ease, border-color 0.5s ease;
        }

        .status-online { background-color: #23a55a; }
        .status-idle { background-color: #f0b232; }
        .status-dnd { background-color: #f23f43; }
        .status-offline { background-color: #747f8d; }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 4px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        /* Текст статуса */
        .status-caption {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        .tag {
            font-weight: 400;
            font-size: 0.8rem;
            margin-bottom: 20px;
            display: block;
            letter-spacing: 0.5px;
            transition: color 0.5s ease;
        }

        .status-box {
            font-size: 0.85rem;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            transition: background 0.5s ease, border-color 0.5s ease, color 0.5s ease;
        }

        .activity-text {
            font-size: 0.75rem;
            transition: color 0.5s ease;
        }

        /* Кнопка ссылки на Дискорд */
        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .discord-btn:hover {
            transform: scale(1.02);
        }

        /* Разделитель */
        .separator {
            height: 1px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        /* Блок формы вебхука */
        .msg-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 0.8rem;
            outline: none;
            resize: none;
            font-family: inherit;
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        .msg-send-btn {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .msg-send-btn:hover {
            transform: scale(1.01);
        }

        .msg-status {
            font-size: 0.75rem;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="bg" class="background-image"></div>
    <div id="overlay" class="background-overlay"></div>

    <div id="card" class="bio-card">
        <div class="avatar-container">
            <img id="discord-avatar" class="avatar" src="https://archive.org/download/discord-loading-dots-discord-loading/discord-loading-dots-discord-loading.gif" alt="Avatar">
            <div id="status-dot" class="status-dot"></div>
        </div>
        
        <h1 id="username">Загрузка...</h1>
        <div id="caption" class="status-caption">Загрузка...</div>
        <span id="discord-tag" class="tag">@discord</span>

        <div id="status-box" class="status-box">
            <span id="status-text">Получение статуса...</span>
            <span id="activity-text" class="activity-text"></span>
        </div>

        <a id="discord-link" href="https://discord.gg/qgs4ASzPtP" target="_blank" class="discord-btn">
            Зайти в Discord
        </a>

        <div class="separator"></div>

        <div class="msg-form">
            <textarea id="msg-input" class="msg-input" rows="2" placeholder="Напиши мне что-нибудь анонимно..."></textarea>
            <button id="msg-btn" class="msg-send-btn">Отправить анонимку</button>
            <div id="msg-status" class="msg-status"></div>
        </div>
    </div>

    <script>
        const DISCORD_ID = "1447973979171323946"; 
        
        // Твой вебхук успешно подключен
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1507493020017103031/h5vcdsPG6Zz5fdHJGwQpiqLPknlCDf1uBc_qW1MrOsrNbvOmxIT_cAuWDZ-pdfS231EP"; 

        // НАСТРОЙКИ ДЛЯ КАЖДОЙ ТЕМЫ
        const themes = [
            {
                // Тема 1: Закат
                bgImage: "%D0%91%D0%B5%D0%B7%20%D0%BD%D0%B0%D0%B7%D0%B2%D0%B0%D0%BD%D0%B8%D1%8F%20(6).jpg",
                captionText: "I am vibecoder",
                styles: {
                    overlay: "linear-gradient(180deg, rgba(15, 10, 5, 0.5) 0%, rgba(5, 3, 0, 0.85) 100%)",
                    cardBg: "rgba(18, 14, 10, 0.65)",
                    cardBorder: "1px solid rgba(220, 150, 80, 0.15)",
                    cardShadow: "0 40px 100px rgba(0, 0, 0, 0.9), 0 0 40px rgba(220, 150, 80, 0.03)",
                    avatarBorder: "2px solid rgba(220, 150, 80, 0.25)",
                    dotBorder: "4px solid #120e0a",
                    captionColor: "#dd9c5a",
                    captionShadow: "0 0 10px rgba(221, 156, 90, 0.2)",
                    tagColor: "rgba(220, 180, 150, 0.35)",
                    boxBg: "rgba(10, 7, 5, 0.5)",
                    boxBorder: "1px solid rgba(220, 150, 80, 0.06)",
                    boxColor: "#f3e8de",
                    activityColor: "#a89485",
                    btnBg: "rgba(220, 150, 80, 0.1)",
                    btnBorder: "1px solid rgba(220, 150, 80, 0.25)",
                    btnColor: "#dd9c5a",
                    btnShadow: "0 0 15px rgba(220, 150, 80, 0.1)",
                    inputFocus: "rgba(220, 150, 80, 0.4)",
                    submitBg: "#dd9c5a",
                    submitColor: "#120e0a"
                }
            },
            {
                // Тема 2: Гуль / Брайар
                bgImage: "%E2%98%86%20Suzuya%20Juuzou%20%E2%98%86_Tokyo%20Ghoul.jpg",
                captionText: "ВСЯ ЭТА КРОВЬ МНЕ (знаю что Briar)",
                styles: {
                    overlay: "linear-gradient(180deg, rgba(20, 0, 0, 0.55) 0%, rgba(5, 0, 0, 0.9) 100%)",
                    cardBg: "rgba(12, 5, 5, 0.7)",
                    cardBorder: "1px solid rgba(239, 68, 68, 0.15)",
                    cardShadow: "0 40px 100px rgba(0, 0, 0, 0.95), 0 0 40px rgba(239, 68, 68, 0.03)",
                    avatarBorder: "2px solid rgba(239, 68, 68, 0.25)",
                    dotBorder: "4px solid #0c0505",
                    captionColor: "#ef4444",
                    captionShadow: "0 0 10px rgba(239, 68, 68, 0.4)",
                    tagColor: "rgba(239, 150, 150, 0.3)",
                    boxBg: "rgba(10, 4, 4, 0.6)",
                    boxBorder: "1px solid rgba(239, 68, 68, 0.08)",
                    boxColor: "#fca5a5",
                    activityColor: "#f87171",
                    btnBg: "rgba(239, 68, 68, 0.08)",
                    btnBorder: "1px solid rgba(239, 68, 68, 0.25)",
                    btnColor: "#ef4444",
                    btnShadow: "0 0 15px rgba(239, 68, 68, 0.1)",
                    inputFocus: "rgba(239, 68, 68, 0.4)",
                    submitBg: "#ef4444",
                    submitColor: "#ffffff"
                }
            }
        ];

        const currentTheme = themes[Math.floor(Math.random() * themes.length)];
        
        document.getElementById('bg').style.backgroundImage = `url('${currentTheme.bgImage}')`;
        document.getElementById('caption').innerText = currentTheme.captionText;
        
        const s = currentTheme.styles;
        document.getElementById('overlay').style.background = s.overlay;
        
        const card = document.getElementById('card');
        card.style.background = s.cardBg;
        card.style.border = s.cardBorder;
        card.style.boxShadow = s.cardShadow;
        
        document.getElementById('discord-avatar').style.border = s.avatarBorder;
        document.getElementById('status-dot').style.borderColor = s.dotBorder.split(' ')[2];
        
        const cap = document.getElementById('caption');
        cap.style.color = s.captionColor;
        cap.style.textShadow = s.captionShadow;
        
        document.getElementById('discord-tag').style.color = s.tagColor;
        
        const box = document.getElementById('status-box');
        box.style.background = s.boxBg;
        box.style.borderColor = s.boxBorder.split(' ')[2];
        box.style.color = s.boxColor;
        
        document.getElementById('activity-text').style.color = s.activityColor;

        const btn = document.getElementById('discord-link');
        btn.style.background = s.btnBg;
        btn.style.border = s.btnBorder;
        btn.style.color = s.btnColor;
        btn.style.boxShadow = s.btnShadow;

        const submitBtn = document.getElementById('msg-btn');
        submitBtn.style.background = s.submitBg;
        submitBtn.style.color = s.submitColor;

        const inputField = document.getElementById('msg-input');
        inputField.addEventListener('focus', () => inputField.style.borderColor = s.inputFocus);
        inputField.addEventListener('blur', () => inputField.style.borderColor = 'rgba(255, 255, 255, 0.1)');

        btn.addEventListener('mouseenter', () => {
            btn.style.background = currentTheme.captionText.includes("КРОВЬ") ? 'rgba(239, 68, 68, 0.2)' : 'rgba(220, 150, 80, 0.2)';
            btn.style.boxShadow = currentTheme.captionText.includes("КРОВЬ") ? '0 0 20px rgba(239, 68, 68, 0.4)' : '0 0 20px rgba(220, 150, 80, 0.4)';
        });
        btn.addEventListener('mouseleave', () => {
            btn.style.background = s.btnBg;
            btn.style.boxShadow = s.btnShadow;
        });

        card.addEventListener('mouseenter', () => {
            card.style.transform = 'translateY(-4px)';
            card.style.borderColor = currentTheme.captionText.includes("КРОВЬ") ? 'rgba(239, 68, 68, 0.35)' : 'rgba(220, 150, 80, 0.3)';
            card.style.background = currentTheme.captionText.includes("КРОВЬ") ? 'rgba(16, 6, 6, 0.8)' : 'rgba(22, 16, 12, 0.75)';
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = 'translateY(0)';
            card.style.border = s.cardBorder;
            card.style.background = s.cardBg;
        });

        // --- ЛОГИКА ОТПРАВКИ ВЕБХУКА ---
        submitBtn.addEventListener('click', async () => {
            const text = inputField.value.trim();
            const statusEl = document.getElementById('msg-status');
            
            if(!text) {
                statusEl.innerText = "Сначала напиши что-нибудь!";
                statusEl.style.color = "#ff4444";
                statusEl.style.display = "block";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Отправка...";

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "📩 Новое анонимное сообщение с сайта!",
                            description: `**Текст:** ${text}`,
                            color: currentTheme.captionText.includes("КРОВЬ") ? 15672356 : 14456376, 
                            timestamp: new Date()
                        }]
                    })
                });

                if(response.ok) {
                    statusEl.innerText = "Успешно отправлено!";
                    statusEl.style.color = "#23a55a";
                    statusEl.style.display = "block";
                    inputField.value = ""; 
                } else {
                    throw new Error();
                }
            } catch (e) {
                statusEl.innerText = "Ошибка при отправке.";
                statusEl.style.color = "#ff4444";
                statusEl.style.display = "block";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Отправить анонимку";
            }
        });

        // Анимация названия вкладки
        const titles = [">-<", "•_•", "~_~", "^_-", "x_x", "о_о"];
        let titleIndex = 0;
        setInterval(() => {
            document.title = titles[titleIndex];
            titleIndex = (titleIndex + 1) % titles.length;
        }, 2000);

        // API Discord статус
        async function fetchDiscordStatus() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const data = await response.json();
                
                if (data.success) {
                    const user = data.data;
                    document.getElementById('username').innerText = user.discord_user.global_name || user.discord_user.username;
                    document.getElementById('discord-tag').innerText = `@${user.discord_user.username}`;
                    
                    if (user.discord_user.avatar) {
                        const isGif = user.discord_user.avatar.startsWith('a_');
                        const ext = isGif ? 'gif' : 'png';
                        document.getElementById('discord-avatar').src = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.discord_user.avatar}.${ext}?size=256`;
                    }
                    
                    const dot = document.getElementById('status-dot');
                    dot.className = 'status-dot'; 
                    dot.classList.add(`status-${user.discord_status}`);
                    
                    const statusText = document.getElementById('status-text');
                    if (user.discord_status === 'online') statusText.innerText = 'В сети';
                    else if (user.discord_status === 'idle') statusText.innerText = 'Не активен';
                    else if (user.discord_status === 'dnd') statusText.innerText = 'Не беспокоить';
                    else statusText.innerText = 'Офлайн';
                    
                    const activityText = document.getElementById('activity-text');
                    activityText.innerText = ""; 
                    
                    if (user.activities && user.activities.length > 0) {
                        const customStatus = user.activities.find(a => a.type === 4);
                        const gameStatus = user.activities.find(a => a.type === 0);
                        const spotify = user.listening_to_spotify ? user.spotify : null;

                        if (customStatus && customStatus.state) {
                            activityText.innerText = customStatus.state;
                        }
