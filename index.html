<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #09090b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .bio-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 35px 25px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            width: 300px;
            transition: transform 0.3s ease;
        }
        .bio-card:hover {
            transform: translateY(-5px);
        }
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #1e1f22;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        /* Индикатор статуса */
        .status-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 4px solid #09090b;
            background-color: #747f8d;
            transition: background-color 0.3s ease;
        }
        /* Цвета статусов */
        .status-online { background-color: #23a55a; }
        .status-idle { background-color: #f0b232; }
        .status-dnd { background-color: #f23f43; }
        .status-offline { background-color: #747f8d; }

        h1 {
            font-size: 1.6rem;
            margin: 10px 0 5px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .tag {
            color: #5865F2;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 25px;
            display: block;
        }
        .status-box {
            font-size: 0.9rem;
            color: #e4e4e7;
            background: rgba(255, 255, 255, 0.04);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            justify-content: center;
        }
        .activity-text {
            font-size: 0.8rem;
            color: #a1a1aa;
        }
    </style>
</head>
<body>

    <div class="bio-card">
        <div class="avatar-container">
            <img id="discord-avatar" class="avatar" src="https://archive.org/download/discord-loading-dots-discord-loading/discord-loading-dots-discord-loading.gif" alt="Avatar">
            <div id="status-dot" class="status-dot"></div>
        </div>
        
        <h1 id="username">Загрузка...</h1>
        <span id="discord-tag" class="tag">@discord</span>

        <div class="status-box">
            <span id="status-text">Получение статуса...</span>
            <span id="activity-text" class="activity-text"></span>
        </div>
    </div>

    <script>
        const DISCORD_ID = "1447973979171323946"; 

        async function fetchDiscordStatus() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const data = await response.json();
                
                if (data.success) {
                    const user = data.data;
                    
                    // Ник и юзернейм
                    document.getElementById('username').innerText = user.discord_user.global_name || user.discord_user.username;
                    document.getElementById('discord-tag').innerText = `@${user.discord_user.username}`;
                    
                    // Аватарка (проверка на GIF или PNG)
                    if (user.discord_user.avatar) {
                        const isGif = user.discord_user.avatar.startsWith('a_');
                        const ext = isGif ? 'gif' : 'png';
                        document.getElementById('discord-avatar').src = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.discord_user.avatar}.${ext}?size=256`;
                    }
                    
                    // Статус (кружок)
                    const dot = document.getElementById('status-dot');
                    dot.className = 'status-dot'; 
                    dot.classList.add(`status-${user.discord_status}`);
                    
                    // Текст статуса
                    const statusText = document.getElementById('status-text');
                    if (user.discord_status === 'online') statusText.innerText = 'В сети';
                    else if (user.discord_status === 'idle') statusText.innerText = 'Не активен';
                    else if (user.discord_status === 'dnd') statusText.innerText = 'Не беспокоить';
                    else statusText.innerText = 'Офлайн';
                    
                    // Кастомный статус или игра
                    const activityText = document.getElementById('activity-text');
                    activityText.innerText = ""; // Очищаем
                    
                    if (user.activities && user.activities.length > 0) {
                        // Ищем кастомный статус (текст под ником)
                        const customStatus = user.activities.find(a => a.type === 4);
                        // Ищем игру или активность (кроме Spotify и кастомного)
                        const gameStatus = user.activities.find(a => a.type === 0);
                        // Проверяем Spotify
                        const spotify = user.listening_to_spotify ? user.spotify : null;

                        if (customStatus && customStatus.state) {
                            activityText.innerText = customStatus.state;
                        } else if (gameStatus) {
                            activityText.innerText = `Играет в ${gameStatus.name}`;
                        } else if (spotify) {
                            activityText.innerText = `Слушает ${spotify.song} — ${spotify.artist}`;
                        }
                    }
                }
            } catch (error) {
                console.error("Ошибка:", error);
            }
        }

        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, 5000); // Обновление каждые 5 секунд
    </script>
</body>
</html>
